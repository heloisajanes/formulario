<!DOCTYPE html>
<html lang="pr-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Acessibilidade em formularios</title>
</head>
<body>
    <h1>Acessibilidade em formularios</h1>
    <form>
            <label for="nome"></label>
            <input type="text" name="nome" id="nome"><br></br>
            <label for="idade">Idade: </label> 
            <input type="number" name="idade" id="idade"><br></br>
            <fieldset>
                <input type="radio" name="sexo" id="masc">
                <label for="">Masculino</label><br></br>
                <input type="radio" name="sexo" id="fem">
                <label for="">Feminino</label><br></br>
                <input type="radio" name="sexo" id="nao">
                <label for="">Prefirio não informar</label><br></br>
            </fieldset>
    </form>
</body>
</html>
